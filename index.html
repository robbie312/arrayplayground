<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Array Playground</h1>

    <input type="text" id="elementInput" placeholder="Enter an item" />

    <button id="addLast">Add Last</button>
    <button id="addFirst">Add First</button>
    <button id="removeLast">Remove Last</button>
    <button id="removeFirst">Remove First</button>

    <h2>My Array</h2>
    <div id="arrayElements"></div>

    <script src="script.js"></script>
  </body>
</html>
